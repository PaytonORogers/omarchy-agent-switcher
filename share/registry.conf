# Known agents for `omarchy-agents setup`. One per line:
#   id | display name | kind (gui|tui) | detect (bin:<name> | desktop:<file.desktop> | flatpak:<app-id>) | window class | launch (empty for tui = auto) | icon
# tui agents launch as: omarchy-launch-tui --app-id=<window class> <binary>
# --- desktop apps (window classes are best-effort; check with `hyprctl clients`) ---
grok-bot        | Grok Bot     | gui | bin:grok-bot          | grok-bot          | uwsm-app -- grok-bot          | grok-bot
claude-desktop  | Claude       | gui | bin:claude-desktop    | Claude            | uwsm-app -- claude-desktop    | claude
chatgpt-desktop | ChatGPT      | gui | bin:chatgpt           | ChatGPT           | uwsm-app -- chatgpt           | chatgpt
# Icon theme name is the desktop file's Icon= (co.anysphere.cursor), not "cursor".
cursor          | Cursor       | gui | bin:cursor            | Cursor            | uwsm-app -- cursor            | co.anysphere.cursor
hermes-desktop  | Hermes       | gui | bin:hermes-desktop    | Hermes            | uwsm-app -- hermes-desktop    | hermes
# --- terminal agents ---
grok            | Grok Build   | tui | bin:grok              | org.omarchy.grokbuild        | | grok
claude          | Claude Code  | tui | bin:claude            | org.omarchy.agent.claude     | | claude
codex           | Codex        | tui | bin:codex             | org.omarchy.agent.codex      | | codex
gemini          | Gemini CLI   | tui | bin:gemini            | org.omarchy.agent.gemini     | |
opencode        | opencode     | tui | bin:opencode          | org.omarchy.agent.opencode   | |
aider           | Aider        | tui | bin:aider             | org.omarchy.agent.aider      | |
cursor-agent    | Cursor Agent | tui | bin:cursor-agent      | org.omarchy.agent.cursoragent| |
copilot         | Copilot CLI  | tui | bin:copilot           | org.omarchy.agent.copilot    | |
crush           | Crush        | tui | bin:crush             | org.omarchy.agent.crush      | |
goose           | Goose        | tui | bin:goose             | org.omarchy.agent.goose      | |
amp             | Amp          | tui | bin:amp               | org.omarchy.agent.amp        | |
qwen            | Qwen Code    | tui | bin:qwen              | org.omarchy.agent.qwen       | |
hermes          | Hermes CLI   | tui | bin:hermes            | org.omarchy.agent.hermes     | | hermes
